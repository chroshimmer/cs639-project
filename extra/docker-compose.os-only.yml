name: agentbench-fc

x-os-worker-common: &os-worker-common
  image: agentbench-os-worker:latest
  build:
    context: ..
    dockerfile: src/server/tasks/os_interaction/Dockerfile
  depends_on:
    - controller
    - redis
  volumes:
    # Rootless Docker socket from the host, mounted into each OS worker container.
    - "${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock"

services:
  controller:
    image: jingbh/agentrl-controller:latest
    container_name: agentrl-controller
    ports:
      - "5020:5020"
    command: ["controller"]

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    # Avoid Docker volume + xattr copy issues on rootless/shared filesystems.
    tmpfs:
      - /data

  os_interaction-std:
    <<: *os-worker-common
    command: ["--controller", "http://controller:5020/api", "os-std"]
    environment:
      - OS_STD_PARAMETERS_ENV_OPTIONS_NETWORK_NAME=agentbench-fc_default
      - OS_STD_PARAMETERS_STATE_OPTIONS_CONNECTION_HOST=redis

  os_interaction-monitor-replan:
    <<: *os-worker-common
    command: ["--controller", "http://controller:5020/api", "os-std-monitor-replan"]
    environment:
      - OS_STD_MONITOR_REPLAN_PARAMETERS_ENV_OPTIONS_NETWORK_NAME=agentbench-fc_default
      - OS_STD_MONITOR_REPLAN_PARAMETERS_STATE_OPTIONS_CONNECTION_HOST=redis

  # HORIZON safe subset: run each horizon level separately.
  os_interaction-horizon-cf0:
    <<: *os-worker-common
    command: ["--controller", "http://controller:5020/api", "os-horizon-cf0"]
    environment:
      - OS_HORIZON_CF0_PARAMETERS_ENV_OPTIONS_NETWORK_NAME=agentbench-fc_default
      - OS_HORIZON_CF0_PARAMETERS_STATE_OPTIONS_CONNECTION_HOST=redis

  os_interaction-horizon-cf0-monitor-replan:
    <<: *os-worker-common
    command: ["--controller", "http://controller:5020/api", "os-horizon-cf0-monitor-replan"]
    environment:
      - OS_HORIZON_CF0_MONITOR_REPLAN_PARAMETERS_ENV_OPTIONS_NETWORK_NAME=agentbench-fc_default
