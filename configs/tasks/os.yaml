default:
  module: src.server.tasks.os_interaction.OSInteraction
  parameters:
    concurrency: 32
    round_limit: 8
    tools:
    - type: function
      function:
        name: bash_action
        description: Execute bash code to perform an operation in the Linux environment.
        parameters:
          type: object
          properties:
            script:
              type: string
              description: The bash script to be executed.
          required:
          - script
          additionalProperties: false
    - type: function
      function:
        name: finish_action
        description: Indicate that the task has been finished or need some additional
          information to be finished.
        parameters:
          type: object
          properties:
            thought:
              type: string
              description: The thought or reason indicating the task is finished.
          required:
          - thought
          additionalProperties: false
    - type: function
      function:
        name: answer_action
        description: Provide the answer to the question.
        parameters:
          type: object
          properties:
            answer:
              type: string
              description: The answer to the question.
          required:
          - answer
          additionalProperties: false
    docker_config:
      localhost: local-os
      directory: data/os_interaction/res/dockerfiles
    monitor_config:
      enabled: false
      max_interventions: 3
      cooldown_rounds: 1
      loop_similarity_threshold: 0.88
    scripts:
      directory: data/os_interaction/res/scripts
    env_driver: docker
    env_options:
      network_name: agentbench-fc_default
      state_driver: redis
      state_options:
        connection:
          host: redis
